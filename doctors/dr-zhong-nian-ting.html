<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍾念庭醫師｜曜診所 Flos Clinic</title>
<style>
  :root{
    --ink:#F1EADC; --ink-soft:#C0C8C8; --paper:#132728; --paper-deep:#2B3C3C;
    --line:#445150; --gold:#FBFDFD; --gold-deep:#C0C8C8; --white:#445150;
    --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC",sans-serif;
    --maxw:880px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:var(--sans); background:var(--paper); color:var(--ink); line-height:1.9; }
  a{ color:inherit; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }
  header{ padding:28px 0; border-bottom:1px solid var(--line); }
  .back-link{ font-size:13px; letter-spacing:0.08em; color:var(--ink-soft); text-decoration:none; }
  .back-link:hover{ color:var(--gold); }
  main{ padding:64px 0 100px; }
  .profile-head{ display:flex; gap:40px; align-items:flex-start; flex-wrap:wrap; }
  .photo-block{
    width:200px; height:220px; flex-shrink:0; border-radius:2px; position:relative; overflow:hidden;
    background:
      linear-gradient(160deg, rgba(192,200,200,0.20), rgba(19,39,40,0.08)),
      var(--paper-deep);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft); font-size:12px; letter-spacing:0.08em; text-align:center; padding:16px;
  }
  .eyebrow{ font-size:12.5px; letter-spacing:0.3em; color:var(--gold-deep); margin-bottom:14px; }
  h1{ font-family:var(--serif); font-size:clamp(28px,3.6vw,40px); font-weight:600; }
  .branch-tag{ margin-top:14px; display:inline-block; padding:6px 14px; border:1px solid var(--gold-deep); border-radius:999px; font-size:12.5px; color:var(--gold-deep); letter-spacing:0.06em; }
  .body-copy{ margin-top:56px; max-width:640px; color:var(--ink-soft); font-size:15.5px; }
  .body-copy h2{ font-family:var(--serif); color:var(--ink); font-size:20px; margin:36px 0 14px; font-weight:600; }
  .body-copy ul{ margin:0 0 0 20px; }
  .body-copy li{ margin-bottom:8px; }
  .note{ margin-top:56px; padding:20px 22px; background:var(--paper-deep); border-left:3px solid var(--gold-deep); font-size:13px; color:var(--ink-soft); line-height:1.8; }
  .cta{ margin-top:48px; }
  .cta-btn{ display:inline-block; border:1px solid var(--ink); padding:12px 26px; border-radius:999px; font-size:13.5px; letter-spacing:0.08em; text-decoration:none; }
  .cta-btn:hover{ background:var(--ink); color:var(--white); }
  @media (max-width:600px){ .profile-head{ flex-direction:column; } .photo-block{ width:100%; height:240px; } }
</style>
</head>
<body>
<header><div class="wrap"><a href="../index.html#team" class="back-link">← 返回醫療團隊</a></div></header>
<main>
  <div class="wrap">
    <div class="profile-head">
      <div class="photo-block">醫師照片預留位置</div>
      <div>
        <div class="eyebrow">MEDICAL TEAM</div>
        <h1>鍾念庭醫師</h1>
        <span class="branch-tag">文心店</span>
      </div>
    </div>

    <div class="body-copy">
      <h2>學經歷</h2>
      <ul>
        <li>中山醫學大學醫學系畢業</li>
        <li>臺中榮總家醫部主治醫師、總醫師、住院醫師</li>
        <li>臺中榮總減重中心／健康管理中心主治醫師</li>
        <li>微整形美容醫學會會員</li>
      </ul>
      <h2>專長</h2>
      <ul>
        <li>家庭醫學科專科醫師、中華民國肥胖研究學會專科醫師</li>
        <li>肥胖症與體重管理</li>
        <li>慢性病管理</li>
        <li>健康管理與諮詢</li>
        <li>骨質疏鬆</li>
        <li>旅遊醫學與戒菸治療</li>
      </ul>
    </div>

    <div class="note">本頁學經歷與專長資訊由診所提供，僅供衛教與團隊介紹用途，實際療程建議請以醫師現場評估為準。</div>
    <div class="cta"><a href="../index.html#book" class="cta-btn">預約諮詢</a></div>
  </div>
</main>
</body>
</html>
